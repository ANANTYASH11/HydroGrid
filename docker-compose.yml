version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0-alpine
    container_name: hydrogrid-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: hydrogrid
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/hydrogrid -u admin -p password
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend API
  hydrogrid-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hydrogrid-api
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/hydrogrid?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      PORT: 5000
      CLIENT_URL: http://localhost
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  hydrogrid-web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hydrogrid-web
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost/api
    depends_on:
      - hydrogrid-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_data:
    driver: local

networks:
  default:
    name: hydrogrid-network
